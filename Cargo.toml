[workspace]
members = [
    "re-core",
    "re-gui",
    "re-mcp",
    "re-cli",
]
resolver = "3"

[workspace.package]
version = "0.7.1"
edition = "2024"
authors = ["Aleksandr Pavlov <ckidoz@gmail.com>"]
license = "MIT"
repository = "https://github.com/kidoz/sleuthre"
description = "An open-source reverse engineering desktop application."

[workspace.dependencies]
eframe = "0.36"
re-core = { path = "re-core" }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
goblin = "0.10"
# Match the backends in re-core's Disassembler. Recheck the bundled C engine
# when upgrading: capstone-sys 0.18 ships 5.0.6, upstream fixes landed in 5.0.9.
capstone = { version = "0.14", default-features = false, features = [
    "std", "full", "arch_x86", "arch_arm", "arch_arm64", "arch_mips", "arch_riscv",
] }
rusqlite = { version = "0.43", features = ["bundled"] }
petgraph = "0.8"
bitflags = { version = "2.13", features = ["serde"] }
rfd = "0.18"
uuid = { version = "1.29", features = ["v4", "serde"] }
clap = { version = "4.6", features = ["derive"] }
gimli = "0.34"
object = { version = "0.41", default-features = false, features = ["read"] }
pdb = "0.8"
rhai = "1.27"
egui_dock = "0.21"

[profile.release]
lto = true
strip = true
